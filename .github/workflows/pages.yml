name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Every top-level folder with a package.json is a game: build it and
      # publish its dist/ at /<folder>/. The root index.html + thumbs/ are the landing page.
      - name: Build games
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -r thumbs _site/
          for pkg in */package.json; do
            game="$(dirname "$pkg")"
            echo "::group::Building $game"
            (cd "$game" && npm ci && npm run build)
            cp -r "$game/dist" "_site/$game"
            echo "::endgroup::"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
